services:
  db:
    image:  docker.arvancloud.ir/postgres:18-alpine3.22
    restart: unless-stopped
    shm_size: 128mb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
#    volumes:
#      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cache:
    image:  docker.arvancloud.ir/redis:8.2.4-alpine3.22
    restart: unless-stopped
    ports:
      - "6379:6379"

  adminer:
    image:  docker.arvancloud.ir/adminer:5.4.2
    restart: always
    ports:
      - 8080:8080

  migrate:
    image: docker.arvancloud.ir/migrate/migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint: [
      "migrate",
      "-source", "file://migrations",
      "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable",
      "up"
    ]
volumes:
  db_data: